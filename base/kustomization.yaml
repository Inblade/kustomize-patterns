apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Common labels applied to every object AND selectors.
# NOTE: selectors are immutable — pick these once, before first deploy.
labels:
  - pairs:
      app.kubernetes.io/part-of: demo-app
    includeSelectors: false
